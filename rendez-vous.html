<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Étapes de processus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
  body {
    background-color: #F8F8F8;
  }
    .stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 40px auto;
      max-width: 800px;
    }

    .step {
      text-align: center;
      position: relative;
      flex: 1;
    }

    .step:not(:last-child)::after {
      content: '';
      position: absolute;
      top: 20px;
      right: -50%;
      width: 100%;
      height: 4px;
      background-color: #dee2e6;
      z-index: 0;
    }

    .circle {
      width: 40px;
      height: 40px;
      border-radius: 25%;
      background-color: #dee2e6;
      margin: 0 auto;
      position: relative;
      z-index: 1;
      transition: background-color 0.3s ease;
    }

    .step.active .circle {
      background-color: #008D93;
    }

    .step.completed .circle {
      background-color: #008D93;
    }
    .step.completed p {
      color: #008D93;
    }
    .step.active p {
      color: #008D93;
    }
    .step p {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
    }

    .buttons {
      text-align: center;
      margin-top: 30px;
    }
  </style>
</head>
<body>
    
  <div class="container bg-white rounded-3">
    <div class="stepper border-bottom py-3" id="stepper">
      <div class="step active">
        <div class="circle"></div>
        <p>Rendez-vous</p>
      </div>
      <div class="step">
        <div class="circle"></div>
        <p>Vérification</p>
      </div>
      <div class="step">
        <div class="circle"></div>
        <p>Confirmation</p>
      </div>
      <div class="step">
        <div class="circle"></div>
        <p>Validation</p>
      </div>
    </div>
   <div class="d-flex flex-row w-75">
    <div class="d-flex flex-column  border-end p-3">
      <div class="d-flex">
        <div class="user-avatar">
            <img src="./assets/img/user-avatar.png" style="width: 100px; height: 100px;" class="img-fluid rounded-5"
                alt="">
        </div>
        <div class="m-2">
            <h5 class="fw-bold ">Mr Mohamed MBAREK</h5>
            Psychologue
        </div>
    </div>
    <div class="d-flex justify-content-start gap-2">
      <strong>Adresse : </strong><div class="w-50"> 44, avenue de l'environnement, El Aouina Médicale, cabinet A6L'aouina 2045 Tunis Tunisie
      </div>
    </div>
    </div>
   </div>

    <!-- <div class="buttons">
      <button class="btn btn-primary me-2" onclick="prevStep()">Précédent</button>
      <button class="btn btn-success" onclick="nextStep()">Suivant</button>
    </div> -->
  </div>

  <script>
    let currentStep = 0;
    const steps = document.querySelectorAll(".step");

    function updateSteps() {
      steps.forEach((step, index) => {
        step.classList.remove("active", "completed");
        if (index < currentStep) {
          step.classList.add("completed");
        } else if (index === currentStep) {
          step.classList.add("active");
        }
      });
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        updateSteps();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        updateSteps();
      }
    }
  </script>

</body>
</html>
