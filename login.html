          <h2 class="mb-4 fw-bold">Se connecté</h2>
          <form>
            <div class="mb-3 row align-items-center">
              <label for="email" class="col-form-label col-sm-4 text-sm-end text-md-start">Email :</label>
              <div class="col-sm-8">
                <input type="email" class="form-control rounded-2" id="email" placeholder="Entrez votre email" required>
              </div>
            </div>
            <div class="mb-3 row align-items-center">
              <label for="password" class="col-form-label col-sm-4 text-sm-end text-md-start">Mot de passe :</label>
              <div class="col-sm-8">
                <input type="password" class="form-control" id="password" placeholder="Entrez votre mot de passe" required>
              </div>
            </div>
            <div class="d-flex justify-content-start gap-3 mb-3">
              <button type="button" class=" btn-secondary w-50 border-0  text-dark rounded-2 p-1 h-25">Inscription</button>
              <button type="submit" class="btn btn-primary w-50 rounded-2 p-1 h-25">Se connecter</button>
            </div>
            <div>
              <a href="#" class="text-decoration-none forgot-link">Oublié Mot de Passe ?</a>
            </div>
          </form>
        </div>
